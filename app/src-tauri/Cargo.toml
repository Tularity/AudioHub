[package]
name = "audiohub-app"
version = "0.1.0"
edition = "2021"

# Standalone crate: keep the tauri dependency tree out of the main workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: menu bar residency (spec-app §3). The tray glyph is fed to
# Image::new as raw RGBA, so no image-png feature (and no `image` crate) is
# needed — see icons/make-icons.py.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# src/mac_chrome.rs moves the traffic lights onto the app's own top-strip centre
# line; src/icon.rs replaces the dock tile, which tauri 2.11 exposes no API for
# (AppHandle::default_window_icon is a getter and there is nothing else). All
# three crates are already in the lock file at these versions (tao and wry pull
# them in), so this adds compile units, not dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSView",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSToolbar",
  # icon.rs: NSApplication.applicationIconImage, fed an NSImage built from raw
  # RGBA. NSGraphics carries NSDeviceRGBColorSpace.
  "NSApplication",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphics",
] }

# src/win_chrome.rs subclasses the window to hand Snap Layouts back after
# `decorations: false` takes the standard frame away. Same story: `windows` is
# already in the lock at 0.61 via tao.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Reaching `ICoreWebView2Settings` to turn off the Edge context menu, which
# Tauri exposes no setting for — see `win_chrome::silence_webview_context_menu`.
# Already in the lock at 0.38.2 via tauri / tauri-runtime-wry / wry, and its
# `windows-core` matches the `windows` line above, so the COM types unify.
webview2-com = "0.38"
