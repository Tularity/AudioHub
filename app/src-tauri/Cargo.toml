[package]
name = "audiohub-app"
version = "1.0.1"
edition = "2021"

# Standalone crate: keep the tauri dependency tree out of the main workspace.
[workspace]

# Standalone means this crate needs its own copy of the root's dev profile — see
# the comment there for why the macOS default grows target/debug without bound.
[profile.dev]
split-debuginfo = "packed"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
# tray-icon: menu bar residency (spec-app §3). The tray glyph is fed to
# Image::new as raw RGBA, so no image-png feature (and no `image` crate) is
# needed — see icons/make-icons.py.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
audiohub-security = { path = "../../core/audiohub-security" }

# src/mac_chrome.rs moves the traffic lights onto the app's own top-strip centre
# line; src/icon.rs replaces the dock tile, which tauri 2.11 exposes no API for
# (AppHandle::default_window_icon is a getter and there is nothing else). All
# three crates are already in the lock file at these versions (tao and wry pull
# them in), so this adds compile units, not dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
  "NSWindow",
  "NSView",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSToolbar",
  # icon.rs: NSApplication.applicationIconImage, fed an NSImage built from raw
  # RGBA. NSGraphics carries NSDeviceRGBColorSpace.
  "NSApplication",
  "NSRunningApplication",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphics",
  # src/mac_tray.rs: the status item's own NSMenu, plus the label + slider that
  # ride in a view-based NSMenuItem. NSStatusBar/NSStatusBarButton come with
  # NSStatusItem, which is what `tray_icon::TrayIcon::ns_status_item` hands back.
  "NSMenu",
  "NSMenuItem",
  "NSSlider",
  "NSTextField",
  "NSFont",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
] }
# The macOS status item is built on these two directly rather than through
# `tauri::tray` / `tauri::menu`, because neither exposes the underlying NSMenu a
# volume slider has to be inserted into — see the module doc of src/mac_tray.rs
# for the three dead ends. Both are already in the lock at these versions (tauri
# itself depends on them), and the feature set here is copied verbatim from
# tauri's own declaration so unification changes nothing about how they build.
# Windows is untouched: it keeps `tauri::tray::TrayIconBuilder`.
muda = { version = "0.19", default-features = false, features = ["serde", "gtk"] }
tray-icon = { version = "0.24", default-features = false, features = [
  "serde",
  "gtk",
] }

# src/win_chrome.rs subclasses the window to hand Snap Layouts back after
# `decorations: false` takes the standard frame away. Same story: `windows` is
# already in the lock at 0.61 via tao.
[target.'cfg(target_os = "windows")'.dependencies]
audiohub-vad-helper = { path = "../../tools/audiohub-vad-helper" }
sha2 = "0.10"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Reaching `ICoreWebView2Settings` to turn off the Edge context menu, which
# Tauri exposes no setting for — see `win_chrome::silence_webview_context_menu`.
# Already in the lock at 0.38.2 via tauri / tauri-runtime-wry / wry, and its
# `windows-core` matches the `windows` line above, so the COM types unify.
webview2-com = "0.38"
