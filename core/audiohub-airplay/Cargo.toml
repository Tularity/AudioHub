[package]
name = "audiohub-airplay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "AudioHub's cross-platform, audio-only AirPlay receiver adapter"

[features]
default = []
experimental-airplay2 = ["dep:openairplay2"]

[dependencies]
openairplay1 = { path = "../../third_party/openairplay1" }
openairplay2 = { version = "=0.5.0", optional = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
