[package]
name = "audiohub-cli"
version = "1.0.2"
edition = "2021"

[[bin]]
name = "audiohub"
path = "src/main.rs"

[features]
# Test-only fake audio backend: forwards to the daemon library and adds the
# `ctl fake ...` subcommands. Never part of a shipped binary.
fake-audio = ["audiohubd/fake-audio", "audiohub-core/fake-audio"]
# Test-only device-facts injection: forwards to the daemon library and adds
# `ctl test-facts inject`. Never part of a shipped binary.
facts-injection = ["audiohubd/facts-injection", "audiohub-ipc/facts-injection"]

[dependencies]
audiohub-core = { path = "../audiohub-core" }
audiohub-net = { path = "../audiohub-net" }
audiohub-ipc = { path = "../audiohub-ipc" }
audiohubd = { path = "../audiohubd" }
# default features only (no TLS backends) — local loopback IPC
tungstenite = "0.24"
# default-features off drops the anstream color stack (whose windows-sys 0.61
# needs raw-dylib -> dlltool+as, unavailable in the self-contained gnu toolchain)
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
