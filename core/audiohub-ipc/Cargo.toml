[package]
name = "audiohub-ipc"
version = "1.0.2"
edition = "2021"

[features]
# Test-only: the `test.facts.inject` method name (design §8.2). Never enabled
# for a shipped build; audiohubd's build.rs refuses it under
# AUDIOHUB_RELEASE_BUILD=1.
facts-injection = []

[dependencies]
audiohub-core = { path = "../audiohub-core" }
audiohub-net = { path = "../audiohub-net" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"
