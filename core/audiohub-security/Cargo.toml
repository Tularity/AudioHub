[package]
name = "audiohub-security"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Private filesystem permissions shared by AudioHub components"

[dependencies]
quick-xml = "0.41"

[target.'cfg(windows)'.dependencies]
# 0.52 uses ordinary import libraries and remains compatible with AudioHub's
# x86_64-pc-windows-gnu build. Newer raw-dylib releases do not.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
