[package]
name = "openairplay1"
version = "0.3.0"
edition = "2021"
# The floor set by our use of u64::is_multiple_of; CI-less repo, tests run
# on current stable.
rust-version = "1.87"
description = "Embeddable AirPlay 1 (RAOP) audio receiver library (network in, PCM + events out)"
license = "MIT"
repository = "https://github.com/st3fan/openairplay1"
documentation = "https://docs.rs/openairplay1"
readme = "PROVENANCE.md"
keywords = ["airplay", "airplay1", "raop", "audio", "receiver"]
categories = ["multimedia::audio", "network-programming"]

# No audio-output dependency here: the host owns PCM → speaker. This crate
# must keep building (and its tests passing) on macOS as well as Linux.
[dependencies]
aes = "0.8"
alac = "0.5"
base64 = "0.22"
cbc = "0.1"
getrandom = "0.2"
log = "0.4"
md-5 = "0.10"
rsa = "0.9"
sha1 = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }
