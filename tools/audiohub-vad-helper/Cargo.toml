[package]
name = "audiohub-vad-helper"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Elevated, fixed-purpose installer for AudioHubVad on Windows"

[build-dependencies]
sha2 = "0.10"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
sha2 = "0.10"
# Keep the same pre-raw-dylib generation used by audiohub-security. It links
# under both MSVC (the shipped helper) and the workspace's Windows GNU checks.
windows-sys = { version = "0.52", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
